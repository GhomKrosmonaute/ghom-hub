services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ghom
      POSTGRES_PASSWORD: ghom
      POSTGRES_DB: ghom_hub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghom -d ghom_hub"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
